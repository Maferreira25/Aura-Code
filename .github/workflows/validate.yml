name: validate-framework

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate framework
        run: python3 tools/validate_framework.py
      - name: Validate empirical suite
        run: python3 validation/tools/validate_suite.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
