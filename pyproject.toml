[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auracode"
version = "0.3.0.dev0"
description = "AuraCode — Agentic Unified Reliability & Assurance. Active guardrails, architectural contracts, and software assurance for AI-driven development."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "AuraCode Contributors" }
]
keywords = [
  "ai-assurance",
  "guardrails",
  "clean-architecture",
  "ast-linter",
  "agentic-ai",
  "anti-hallucination",
  "mcp-server",
  "devsecops",
  "llm-security"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security"
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "pytest-cov",
  "hypothesis>=6.0"
]
multilang = [
  "tree-sitter>=0.21.0",
  "tree-sitter-javascript>=0.21.0",
  "tree-sitter-typescript>=0.21.0",
  "tree-sitter-go>=0.21.0",
  "tree-sitter-java>=0.21.0",
  "tree-sitter-c-sharp>=0.21.0"
]

[project.scripts]
auracode = "auracode.cli:main"

[project.urls]
"Homepage" = "https://github.com/Maferreira25/Aura-Code"
"Documentation" = "https://github.com/Maferreira25/Aura-Code/tree/main/docs"
"Repository" = "https://github.com/Maferreira25/Aura-Code"
"Issues" = "https://github.com/Maferreira25/Aura-Code/issues"

[tool.setuptools.package-dir]
"auracode.tools" = "tools"
"auracode.templates" = "templates"
"auracode.schemas" = "schemas"
"auracode.profiles" = "profiles"
"auracode.controls" = "controls"

[tool.setuptools]
packages = [
  "auracode",
  "auracode.studio",
  "auracode.tools",
  "auracode.templates",
  "auracode.schemas",
  "auracode.profiles",
  "auracode.controls",
]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.txt", "*.yaml", "*.yml"]
"auracode.studio" = ["assets/**/*"]
"auracode.templates" = ["**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["_auracode_forward/saas"]
